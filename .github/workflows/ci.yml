name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin needs a Node with native TypeScript support, since the tests
        # exercise generated JS and native-TS test fixtures.
        node: ['22.19.0', '24.11.0']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - name: Checkout pinned DSH contract sources
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db
          path: .harness-contract
          persist-credentials: false
          sparse-checkout: |
            packages/llm/llm/src
            packages/util/brand/src
            packages/util/values/src
            packages/util/crypto/src
      - name: Candidate tests and distribution
        run: pnpm check
      - name: Real DSH stream and replay contract
        run: pnpm verify:harness .harness-contract
